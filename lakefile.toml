name = "OTSelector"
version = "1.0.0"
defaultTargets = ["OTSelector"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d77ef0741c6da1ff12df68fb4145ea0ae0850c54"

[[lean_lib]]
name = "OTSelector"
globs = ["OTSelector", "OTSelector.+"]

[[lean_lib]]
name = "LeanPool"
srcDir = "vendor/lean-pool"
globs = ["LeanPool.+"]

[lean_lib.leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
